[package]
name = "zephium-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Browser-owned camera/microphone prompts for foreground macOS tabs.
macos-page-permission-prompts = []
# Retired Work/agent gates. The modules they selected are gone from this
# tree; the names stay declared and empty so historical cfg sites resolve to
# false instead of warning.
work-planning = []
work-runtime = []
work-synthesis-probe = []
work-execution = []
work-execution-probe = []
agentic-browser = []

[dependencies]
socket2 = { version = "=0.6.5", optional = true }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "stream"], optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
zephium-private-fs = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
psl = "=2.1.220"
sha2 = { version = "=0.10.9", optional = true }
sha1 = { version = "=0.10.6", optional = true }
flate2 = { version = "=1.1.9", default-features = false, features = ["rust_backend"], optional = true }
tokio = { workspace = true, optional = true, features = ["time", "process", "io-util", "net"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
zephium-core.workspace = true
zephium-ipc.workspace = true
base64.workspace = true
url.workspace = true

regex = { version = "=1.12.4", optional = true }
globset = { version = "=0.4.20", optional = true }
ignore = { version = "=0.4.33", optional = true }
grep-searcher = { version = "=0.1.17", optional = true }
grep-regex = { version = "=0.1.14", optional = true }
grep-matcher = { version = "=0.1.9", optional = true }
similar = { version = "=3.2.0", optional = true }
lopdf = { version = "=0.45.0", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = { version = "=0.2.191", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Shell", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_Isolation", "Win32_Security_Authorization"] }

[dev-dependencies]
serde_json.workspace = true
zephium-store.workspace = true
tempfile.workspace = true
